name: Deploy Sree Laxmi Developers to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows:
      - 'pages build and deployment'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'vite-gh-pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

      - name: Verify dist output directory
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          ls -la dist
          ls -la dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for built-in branch Pages build if active
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 10
          for i in $(seq 1 30); do
            ACTIVE=$(curl -s "https://api.github.com/repos/$GH_REPO/actions/runs?per_page=10" | \
              python3 -c "import sys, json; data=json.load(sys.stdin); runs=[r for r in data.get('workflow_runs', []) if (r.get('event')=='dynamic' or r.get('name')=='pages build and deployment') and r.get('status')!='completed']; print(len(runs))" 2>/dev/null || echo "0")
            if [ "$ACTIVE" = "0" ]; then
              echo "No active built-in Jekyll Pages build running. Proceeding with Vite dist deployment."
              break
            fi
            echo "Waiting for built-in 'pages build and deployment' to finish first ($i/30)..."
            sleep 5
          done
          sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
