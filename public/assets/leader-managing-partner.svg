<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="mpNeutralBg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3F0EA" />
      <stop offset="100%" stop-color="#E6E0D4" />
    </linearGradient>
    <linearGradient id="mpExecSuit" x1="40" y1="145" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A3358" />
      <stop offset="100%" stop-color="#01183C" />
    </linearGradient>
    <linearGradient id="mpHeadTone" x1="90" y1="50" x2="150" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFCFAF" />
      <stop offset="100%" stop-color="#C6AF89" />
    </linearGradient>
  </defs>

  <!-- Soft Neutral Studio Background -->
  <rect width="240" height="240" fill="url(#mpNeutralBg)" />

  <!-- Subtle Inner Ring -->
  <circle cx="120" cy="120" r="112" stroke="#D8C5A3" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Executive Shoulders & Suit -->
  <path
    d="M34 240C38 182 68 150 120 150C172 150 202 182 206 240H34Z"
    fill="url(#mpExecSuit)"
  />

  <!-- Crisp White Shirt & Gold Tie -->
  <path d="M96 150L120 212L144 150H96Z" fill="#FFFFFF" />
  <path d="M114 166H126L129 216L120 228L111 216L114 166Z" fill="#C9A45C" />

  <!-- Neck & Head Silhouette -->
  <rect x="106" y="124" width="28" height="32" rx="10" fill="#C6AF89" />
  <ellipse cx="120" cy="92" rx="31" ry="38" fill="url(#mpHeadTone)" />
  <path
    d="M89 86C90 62 103 49 120 49C137 49 150 62 151 86C145 73 135 66 120 66C105 66 95 73 89 86Z"
    fill="#1E2F4D"
  />
