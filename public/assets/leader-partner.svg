<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="ptNeutralBg" x1="240" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3F0EA" />
      <stop offset="100%" stop-color="#E6E0D4" />
    </linearGradient>
    <linearGradient id="ptExecSuit" x1="40" y1="145" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#213B63" />
      <stop offset="100%" stop-color="#082147" />
    </linearGradient>
    <linearGradient id="ptHeadTone" x1="90" y1="50" x2="150" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFCFAF" />
      <stop offset="100%" stop-color="#C6AF89" />
    </linearGradient>
  </defs>

  <!-- Soft Neutral Studio Background -->
  <rect width="240" height="240" fill="url(#ptNeutralBg)" />

  <!-- Subtle Inner Ring -->
  <circle cx="120" cy="120" r="112" stroke="#D8C5A3" stroke-opacity="0.55" stroke-width="1.5" />

  <!-- Executive Shoulders & Suit -->
  <path
    d="M36 240C40 182 70 150 120 150C170 150 200 182 204 240H36Z"
