  />

  <!-- Crisp White Shirt & Gold Tie -->
  <path d="M97 150L120 210L143 150H97Z" fill="#FFFFFF" />
  <path d="M114 166H126L129 214L120 226L111 214L114 166Z" fill="#B58E43" />

  <!-- Neck & Head Silhouette -->
  <rect x="106" y="124" width="28" height="32" rx="10" fill="#C6AF89" />
  <ellipse cx="120" cy="92" rx="30" ry="37" fill="url(#ptHeadTone)" />
  <path
    d="M90 86C91 63 103 50 120 50C137 50 149 63 150 86C144 74 134 67 120 67C106 67 96 74 90 86Z"
    fill="#1E2F4D"
  />
