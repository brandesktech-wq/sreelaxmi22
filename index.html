  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script id="gh-pages-raw-branch-loader">
      (function () {
        var isViteDev = !!document.querySelector('script[src*="@vite/client"]');
        var rawScript = document.querySelector('script[src*="/src/main.tsx"]');
        if (!isViteDev && rawScript) {
          if (rawScript.parentNode) {
            rawScript.parentNode.removeChild(rawScript);
          }
          var basePath =
            window.location.pathname.indexOf('/sreelaxmi22') === 0
              ? '/sreelaxmi22'
              : '';
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = basePath + '/assets/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = basePath + '/assets/app.js';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
